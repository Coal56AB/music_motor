<text x="30" y="42" class="title">Распиновка под вашу компоновку · вид сверху, USB снизу</text>
<text x="30" y="76" class="body">M1 / M2 / M5 / M6 — внешние ряды; M3 / M4 — внутренние. EN = ENABLE.</text>
