<text x="50" y="1013" class="body">Общие сигналы на все драйверы · внутренние контакты</text>
<text x="50" y="1048" class="body">PB15 → MS1     PB13 → MS2     PB11 → MS3     PA8 → SLEEP     PA12 → RESET</text>
<text x="50" y="1076" class="small">GND общий · VDD логики 3,3 В при совместимости модуля · VMOT от отдельного источника</text>
<text x="30" y="1120" class="small">Порядок контактов подтверждён пользователем. Перед пайкой сверьте надписи GPIO на своей плате.</text>
<text x="30" y="1148" class="small">PA11/PA12 используются как GPIO: USB должен идти через CH340, а не через USB-периферию STM32.</text>
